# Netlify builds the site from source on every deploy; this file overrides the dashboard settings.
[build]
  command = "pip install -r requirements.txt && python3 02_BUILD/build.py"
  publish = "01_SITE"

[build.environment]
  PYTHON_VERSION = "3.12"

# Browser caching. Every page links its images, CSS and JS with a ?v= fingerprint that changes whenever the
# file does, so browsers can keep them for a year and still pick up new versions straight away.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
